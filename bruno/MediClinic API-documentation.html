ppointments/calendar?from=2026-11-01&to=2026-12-31` \u2014 Calendar\n        - `PATCH {{baseUrl}}/api/appointments/{{appointmentId}}/status` \u2014 Change Status\n        - `POST {{baseUrl}}/api/appointments` \u2014 Create\n        - `DELETE {{baseUrl}}/api/appointments/{{appointmentId}}` \u2014 Delete\n        - `GET {{baseUrl}}/api/appointments/{{appointmentId}}` \u2014 Get\n        - `GET {{baseUrl}}/api/appointments?page=1&limit=20` \u2014 List\n        - `GET {{baseUrl}}/api/appointments/me` \u2014 Me\n        - `POST {{baseUrl}}/api/appointments/public` \u2014 Public Booking\n        - `GET {{baseUrl}}/api/appointments/today` \u2014 Today\n        - `PATCH {{baseUrl}}/api/appointments/{{appointmentId}}` \u2014 Update\n\n        Toutes les requ\xEAtes utilisent l\u2019environnement **Local** et l\u2019en-t\xEAte `Authorization: Bearer {{accessToken}}` sauf mention contraire.\n      type: text/markdown\n    items:\n      - info:\n          name: Today\n          type: http\n          seq: 1\n        http:\n          method: GET\n          url: '{{baseUrl}}/api/appointments/today'\n          auth:\n            type: bearer\n            token: '{{accessToken}}'\n        runtime:\n          scripts:\n            - type: tests\n              code: |-\n                const body = res.getBody();\n                const isJson = body && typeof body === \"object\" && !Array.isArray(body) && !Buffer.isBuffer(body);\n\n                test(\"statut 2xx\", () => expect(res.status).to.be.within(200, 299));\n                if (res.status !== 204 && isJson) {\n                  test(\"enveloppe data\", () => expect(body).to.have.property(\"data\"));\n                }\n          assertions:\n            - expression: res.status\n              operator: eq\n              value: '200'\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          ### Today\n\n          `GET {{baseUrl}}/api/appointments/today`\n\n          Rendez-vous du jour, tri\xE9s par heure.\n\n          **Authentification** : `Authorization: Bearer {{accessToken}}`\n\n          **R\xE9ponse attendue** : 200 \u2014 enveloppe `{ data: ... }` (ou fichier binaire pour PDF/CSV)\n\n          **Contr\xF4les automatiques** : assertion de statut + test `statut 2xx` + test d\u2019enveloppe JSON (ignor\xE9 pour 204 et les fichiers).\n      - info:\n          name: Calendar\n          type: http\n          seq: 2\n        http:\n          method: GET\n          url: '{{baseUrl}}/api/appointments/calendar?from=2026-11-01&to=2026-12-31'\n          params:\n            - name: from\n              value: '2026-11-01'\n              type: query\n            - name: to\n              value: '2026-12-31'\n              type: query\n          auth:\n            type: bearer\n            token: '{{accessToken}}'\n        runtime:\n          scripts:\n            - type: tests\n              code: |-\n                const body = res.getBody();\n                const isJson = body && typeof body === \"object\" && !Array.isArray(body) && !Buffer.isBuffer(body);\n\n                test(\"statut 2xx\", () => expect(res.status).to.be.within(200, 299));\n                if (res.status !== 204 && isJson) {\n                  test(\"enveloppe data\", () => expect(body).to.have.property(\"data\"));\n                }\n          assertions:\n            - expression: res.status\n              operator: eq\n              value: '200'\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          ### Calendar\n\n          `GET {{baseUrl}}/api/appointments/calendar?from=2026-11-01&to=2026-12-31`\n\n          Agenda d'une plage de dates, group\xE9 par jour.\n\n          **Authentification** : `Authorization: Bearer {{accessToken}}`\n\n          **R\xE9ponse attendue** : 200 \u2014 enveloppe `{ data: ... }` (ou fichier binaire pour PDF/CSV)\n\n          **Contr\xF4les automatiques** : assertion de statut + test `statut 2xx` + test d\u2019enveloppe JSON (ignor\xE9 pour 204 et les fichiers).\n      - info:\n          name: Me\n          type: http\n          seq: 3\n        http:\n          method: GET\n          url: '{{baseUrl}}/api/appointments/me'\n          auth:\n            type: bearer\n            token: '{{accessToken}}'\n        runtime:\n          scripts:\n            - type: tests\n              code: |-\n                const body = res.getBody();\n                const isJson = body && typeof body === \"object\" && !Array.isArray(body) && !Buffer.isBuffer(body);\n\n                test(\"statut 2xx\", () => expect(res.status).to.be.within(200, 299));\n                if (res.status !== 204 && isJson) {\n                  test(\"enveloppe data\", () => expect(body).to.have.property(\"data\"));\n                }\n          assertions:\n            - expression: res.status\n              operator: eq\n              value: '200'\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          ### Me\n\n          `GET {{baseUrl}}/api/appointments/me`\n\n          Rendez-vous du patient connect\xE9.\n\n          **Authentification** : `Authorization: Bearer {{accessToken}}`\n\n          **R\xE9ponse attendue** : 200 \u2014 enveloppe `{ data: ... }` (ou fichier binaire pour PDF/CSV)\n\n          **Contr\xF4les automatiques** : assertion de statut + test `statut 2xx` + test d\u2019enveloppe JSON (ignor\xE9 pour 204 et les fichiers).\n      - info:\n          name: Public Booking\n          type: http\n          seq: 4\n        http:\n          method: POST\n          url: '{{baseUrl}}/api/appointments/public'\n          headers:\n            - name: Content-Type\n              value: application/json\n          body:\n            type: json\n            data: |-\n              {\n                \"doctorId\": 3,\n                \"scheduledAt\": \"2026-12-02 09:00:00\",\n                \"firstName\": \"Pierre\",\n                \"lastName\": \"Lambert\",\n                \"email\": \"pierre.nouveau@email.fr\",\n                \"phone\": \"0341000002\",\n                \"birthDate\": \"1985-03-20\",\n                \"gender\": \"MALE\",\n                \"reason\": \"Douleurs persistantes au genou droit\",\n                \"type\": \"IN_PERSON\"\n              }\n        runtime:\n          scripts:\n            - type: tests\n              code: |-\n                const body = res.getBody();\n                const isJson = body && typeof body === \"object\" && !Array.isArray(body) && !Buffer.isBuffer(body);\n\n                test(\"statut 2xx\", () => expect(res.status).to.be.within(200, 299));\n                if (res.status !== 204 && isJson) {\n                  test(\"enveloppe data\", () => expect(body).to.have.property(\"data\"));\n                }\n          assertions:\n            - expression: res.status\n              operator: eq\n              value: '201'\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          ### Public Booking\n\n          `POST {{baseUrl}}/api/appointments/public`\n\n          Prise de rendez-vous en ligne (public) : statut PENDING, notification aux r\xE9ceptionnistes, cr\xE9ation d'un dossier patient si l'email est inconnu.\n\n          **Authentification** : publique / optionnelle\n\n          **R\xE9ponse attendue** : 201 \u2014 enveloppe `{ data: ... }` (ou fichier binaire pour PDF/CSV)\n\n          **Contr\xF4les automatiques** : assertion de statut + test `statut 2xx` + test d\u2019enveloppe JSON (ignor\xE9 pour 204 et les fichiers).\n      - info:\n          name: List\n          type: http\n          seq: 5\n        http:\n          method: GET\n          url: '{{baseUrl}}/api/appointments?page=1&limit=20'\n          params:\n            - name: page\n              value: '1'\n              type: query\n            - name: limit\n              value: '20'\n              type: query\n          auth:\n            type: bearer\n            token: '{{accessToken}}'\n        runtime:\n          scripts:\n            - type: tests\n              code: |-\n                const body = res.getBody();\n                const isJson = body && typeof body === \"object\" && !Array.isArray(body) && !Buffer.isBuffer(body);\n\n                test(\"statut 2xx\", () => expect(res.status).to.be.within(200, 299));\n                if (res.status !== 204 && isJson) {\n                  test(\"enveloppe data\", () => expect(body).to.have.property(\"data\"));\n                }\n          assertions:\n            - expression: res.status\n              operator: eq\n              value: '200'\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          ### List\n\n          `GET {{baseUrl}}/api/appointments?page=1&limit=20`\n\n          Liste pagin\xE9e des rendez-vous avec filtres statut, type, m\xE9decin, patient, d\xE9partement et p\xE9riode.\n\n          **Authentification** : `Authorization: Bearer {{accessToken}}`\n\n          **R\xE9ponse attendue** : 200 \u2014 enveloppe `{ data: ... }` (ou fichier binaire pour PDF/CSV)\n\n          **Contr\xF4les automatiques** : assertion de statut + test `statut 2xx` + test d\u2019enveloppe JSON (ignor\xE9 pour 204 et les fichiers).\n      - info:\n          name: Create\n          type: http\n          seq: 6\n        http:\n          method: POST\n          url: '{{baseUrl}}/api/appointments'\n          headers:\n            - name: Content-Type\n              value: application/json\n          body:\n            type: json\n            data: |-\n              {\n                \"patientId\": 5,\n                \"doctorId\": 3,\n                \"departmentId\": 2,\n                \"scheduledAt\": \"2026-12-03 10:00:00\",\n                \"duration\": 30,\n                \"type\": \"IN_PERSON\",\n                \"reason\": \"Consultation de suivi\",\n                \"notes\": \"Patient connu\"\n              }\n          auth:\n            type: bearer\n            token: '{{accessToken}}'\n        runtime:\n          scripts:\n            - type: tests\n              code: |-\n                const body = res.getBody();\n                const isJson = body && typeof body === \"object\" && !Array.isArray(body) && !Buffer.isBuffer(body);\n\n                test(\"statut 2xx\", () => expect(res.status).to.be.within(200, 299));\n                if (res.status !== 204 && isJson) {\n                  test(\"enveloppe data\", () => expect(body).to.have.property(\"data\"));\n                }\n          assertions:\n            - expression: res.status\n              operator: eq\n              value: '201'\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          ### Create\n\n          `POST {{baseUrl}}/api/appointments`\n\n          Cr\xE9ation d'un rendez-vous interne ; une r\xE9union Zoom est cr\xE9\xE9e automatiquement pour un type TELEMEDICINE. Conflit de cr\xE9neau \u2192 409.\n\n          **Authentification** : `Authorization: Bearer {{accessToken}}`\n\n          **R\xE9ponse attendue** : 201 \u2014 enveloppe `{ data: ... }` (ou fichier binaire pour PDF/CSV)\n\n          **Contr\xF4les automatiques** : assertion de statut + test `statut 2xx` + test d\u2019enveloppe JSON (ignor\xE9 pour 204 et les fichiers).\n      - info:\n          name: Get\n          type: http\n          seq: 7\n        http:\n          method: GET\n          url: '{{baseUrl}}/api/appointments/{{appointmentId}}'\n          auth:\n            type: bearer\n            token: '{{accessToken}}'\n        runtime:\n          scripts:\n            - type: tests\n              code: |-\n                const body = res.getBody();\n                const isJson = body && typeof body === \"object\" && !Array.isArray(body) && !Buffer.isBuffer(body);\n\n                test(\"statut 2xx\", () => expect(res.status).to.be.within(200, 299));\n                if (res.status !== 204 && isJson) {\n                  test(\"enveloppe data\", () => expect(body).to.have.property(\"data\"));\n                }\n          assertions:\n            - expression: res.status\n              operator: eq\n              value: '200'\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          ### Get\n\n          `GET {{baseUrl}}/api/appointments/{{appointmentId}}`\n\n          D\xE9tail d'un rendez-vous avec la consultation li\xE9e.\n\n          **Authentification** : `Authorization: Bearer {{accessToken}}`\n\n          **R\xE9ponse attendue** : 200 \u2014 enveloppe `{ data: ... }` (ou fichier binaire pour PDF/CSV)\n\n          **Contr\xF4les automatiques** : assertion de statut + test `statut 2xx` + test d\u2019enveloppe JSON (ignor\xE9 pour 204 et les fichiers).\n      - info:\n          name: Change Status\n          type: http\n          seq: 8\n        http:\n          method: PATCH\n          url: '{{baseUrl}}/api/appointments/{{appointmentId}}/status'\n          headers:\n            - name: Content-Type\n              value: application/json\n          body:\n            type: json\n            data: |-\n              {\n                \"status\": \"CONFIRMED\",\n                \"reason\": \"Confirm\xE9 par le secr\xE9tariat\"\n              }\n          auth:\n            type: bearer\n            token: '{{accessToken}}'\n        runtime:\n          scripts:\n            - type: tests\n              code: |-\n                const body = res.getBody();\n                const isJson = body && typeof body === \"object\" && !Array.isArray(body) && !Buffer.isBuffer(body);\n\n                test(\"statut 2xx\", () => expect(res.status).to.be.within(200, 299));\n                if (res.status !== 204 && isJson) {\n                  test(\"enveloppe data\", () => expect(body).to.have.property(\"data\"));\n                }\n          assertions:\n            - expression: res.status\n              operator: eq\n              value: '200'\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          ### Change Status\n\n          `PATCH {{baseUrl}}/api/appointments/{{appointmentId}}/status`\n\n          Changement de statut d'un rendez-vous ; `reason` est obligatoire pour CANCELLED.\n\n          **Authentification** : `Authorization: Bearer {{accessToken}}`\n\n          **R\xE9ponse attendue** : 200 \u2014 enveloppe `{ data: ... }` (ou fichier binaire pour PDF/CSV)\n\n          **Contr\xF4les automatiques** : assertion de statut + test `statut 2xx` + test d\u2019enveloppe JSON (ignor\xE9 pour 204 et les fichiers).\n      - info:\n          name: Update\n          type: http\n          seq: 9\n        http:\n          method: PATCH\n          url: '{{baseUrl}}/api/appointments/{{appointmentId}}'\n          headers:\n            - name: Content-Type\n              value: application/json\n          body:\n            type: json\n            data: |-\n              {\n                \"doctorId\": 3,\n                \"scheduledAt\": \"2026-12-03 11:00:00\",\n                \"duration\": 45,\n                \"notes\": \"Replanifi\xE9\"\n              }\n          auth:\n            type: bearer\n            token: '{{accessToken}}'\n        runtime:\n          scripts:\n            - type: tests\n              code: |-\n                const body = res.getBody();\n                const isJson = body && typeof body === \"object\" && !Array.isArray(body) && !Buffer.isBuffer(body);\n\n                test(\"statut 2xx\", () => expect(res.status).to.be.within(200, 299));\n                if (res.status !== 204 && isJson) {\n                  test(\"enveloppe data\", () => expect(body).to.have.property(\"data\"));\n                }\n          assertions:\n            - expression: res.status\n              operator: eq\n              value: '200'\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          ### Update\n\n          `PATCH {{baseUrl}}/api/appointments/{{appointmentId}}`\n\n          Modification ou replanification d'un rendez-vous.\n\n          **Authentification** : `Authorization: Bearer {{accessToken}}`\n\n          **R\xE9ponse attendue** : 200 \u2014 enveloppe `{ data: ... }` (ou fichier binaire pour PDF/CSV)\n\n          **Contr\xF4les automatiques** : assertion de statut + test `statut 2xx` + test d\u2019enveloppe JSON (ignor\xE9 pour 204 et les fichiers).\n      - info:\n          name: Delete\n          type: http\n          seq: 10\n        http:\n          method: DELETE\n          url: '{{baseUrl}}/api/appointments/{{appointmentId}}'\n          auth:\n            type: bearer\n            token: '{{accessToken}}'\n        runtime:\n          scripts:\n            - type: tests\n              code: |-\n                const body = res.getBody();\n                const isJson = body && typeof body === \"object\" && !Array.isArray(body) && !Buffer.isBuffer(body);\n\n                test(\"statut 2xx\", () => expect(res.status).to.be.within(200, 299));\n                if (res.status !== 204 && isJson) {\n                  test(\"enveloppe data\", () => expect(body).to.have.property(\"data\"));\n                }\n          assertions:\n            - expression: res.status\n              operator: eq\n              value: '204'\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          ### Delete\n\n          `DELETE {{baseUrl}}/api/appointments/{{appointmentId}}`\n\n          Suppression d\xE9finitive d'un rendez-vous. R\xE9ponse 204.\n\n          **Authentification** : `Authorization: Bearer {{accessToken}}`\n\n          **R\xE9ponse attendue** : 204 sans contenu\n\n          **Contr\xF4les automatiques** : assertion de statut + test `statut 2xx` + test d\u2019enveloppe JSON (ignor\xE9 pour 204 et les fichiers).\n  - info:\n      name: Audit\n      type: folder\n    docs:\n      content: |-\n        ## Dossier Audit\n\n        Journal d'audit : consultation pagin\xE9e, statistiques, d\xE9tail et journalisation d'actions c\xF4t\xE9 client.\n\n        ### Requ\xEAtes\n\n        - `POST {{baseUrl}}/api/audit` \u2014 Create\n        - `GET {{baseUrl}}/api/audit/{{auditId}}` \u2014 Get\n        - `GET {{baseUrl}}/api/audit?page=1&limit=20` \u2014 List\n        - `GET {{baseUrl}}/api/audit/stats` \u2014 Stats\n\n        Toutes les requ\xEAtes utilisent l\u2019environnement **Local** et l\u2019en-t\xEAte `Authorization: Bearer {{accessToken}}` sauf mention contraire.\n      type: text/markdown\n    items:\n      - info:\n          name: List\n          type: http\n          seq: 1\n        http:\n          method: GET\n          url: '{{baseUrl}}/api/audit?page=1&limit=20'\n          params:\n            - name: page\n              value: '1'\n              type: query\n            - name: limit\n              value: '20'\n              type: query\n          auth: Url}}/api/audit`\n\n          Journalisation d'une action c\xF4t\xE9 client ; l'auteur est l'utilisateur authentifi\xE9.\n\n          **Authentification** : `Authorization: Bearer {{accessToken}}`\n\n          **R\xE9ponse attendue** : 201 \u2014 enveloppe `{ data: ... }` (ou fichier binaire pour PDF/CSV)\n\n          **Contr\xF4les automatiques** : assertion de statut + test `statut 2xx` + test d\u2019enveloppe JSON (ignor\xE9 pour 204 et les fichiers).\n  - info:\n      name: Auth\n      type: folder\n    docs:\n      content: |-\n        ## Dossier Auth\n\n        Authentification et sessions : connexion, inscription patient, renouvellement avec rotation, d\xE9connexion, profil et changement de mot de passe.\n\n        ### Requ\xEAtes\n\n        - `POST {{baseUrl}}/api/auth/change-password` \u2014 Change Password\n        - `POST {{baseUrl}}/api/auth/login` \u2014 Login\n        - `POST {{baseUrl}}/api/auth/logout` \u2014 Logout\n        - `GET {{baseUrl}}/api/auth/me` \u2014 Me\n        - `POST {{baseUrl}}/api/auth/refresh` \u2014 Refresh\n        - `POST {{baseUrl}}/api/auth/register` \u2014 Register\n\n        Toutes les requ\xEAtes utilisent l\u2019environnement **Local** et l\u2019en-t\xEAte `Authorization: Bearer {{accessToken}}` sauf mention contraire.\n      type: text/markdown\n    items:\n      - info:\n          name: Login\n          type: http\n          seq: 1\n        http:\n          method: POST\n          url: '{{baseUrl}}/api/auth/login'\n          headers:\n            - name: Content-Type\n              value: application/json\n          body:\n            type: json\n            data: |-\n              {\n                \"email\": \"{{email}}\",\n                \"password\": \"{{password}}\"\n              }\n        runtime:\n          variables:\n            - name: email\n              value: superadmin@mediclinic.fr\n            - name: password\n              value: Passw0rd!2026\n          scripts:\n            - type: after-response\n              code: |-\n                const body = res.getBody();\n                const token = body?.data?.tokens?.accessToken;\n\n                if (token) {\n                  bru.setVar(\"accessToken\", token);\n                  bru.setVar(\"refreshToken\", body.data.tokens.refreshToken || \"\");\n                  bru.setVar(\"userEmail\", body.data.user?.email || \"\");\n                }\n\n                test(\"statut 200\", () => expect(res.status).to.equal(200));\n                test(\"token d'acc\xE8s pr\xE9sent\", () => expect(token).to.be.a(\"string\").and.not.empty);\n                test(\"utilisateur authentifi\xE9\", () => expect(body?.data?.user?.email).to.be.a(\"string\").and.not.empty);\n            - type: tests\n              code: |-\n                const body = res.getBody();\n                const isJson = body && typeof body === \"object\" && !Array.isArray(body) && !Buffer.isBuffer(body);\n\n                test(\"statut 2xx\", () => expect(res.status).to.be.within(200, 299));\n                if (res.status !== 204 && isJson) {\n                  test(\"enveloppe data\", () => expect(body).to.have.property(\"data\"));\n                }\n          assertions:\n            - expression: res.status\n              operator: eq\n              value: '200'\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          ### Login\n\n          `POST {{baseUrl}}/api/auth/login`\n\n          Connexion email/mot de passe (public, 10 \xE9checs max / 15 min). Le script post-response stocke `accessToken` et `refreshToken` dans les variables Bruno. R\xE9ponse `{ data: { user, tokens } }`.\n\n          **Authentification** : publique / optionnelle\n\n          **R\xE9ponse attendue** : 200 \u2014 enveloppe `{ data: ... }` (ou fichier binaire pour PDF/CSV)\n\n          **Contr\xF4les automatiques** : assertion ody === \"object\" && !Array.isArray(body) && !Buffer.isBuffer(body);\n\n                test(\"statut 2xx\", () => expect(res.status).to.be.within(200, 299));\n                if (res.status !== 204 && isJson) {\n                  test(\"enveloppe data\", () => expect(body).to.have.property(\"data\"));\n                }\n          assertions:\n            - expression: res.status\n              operator: eq\n              value: '204'\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          ### Reset Password\n\n          `POST {{baseUrl}}/api/users/{{userId}}/reset-password`\n\n          R\xE9initialisation du mot de passe d'un utilisateur. Si `password` est omis, un mot de passe de d\xE9monstration est g\xE9n\xE9r\xE9. R\xE9ponse 204.\n\n          **Authentification** : `Authorization: Bearer {{accessToken}}`\n\n          **R\xE9ponse attendue** : 204 sans contenu\n\n          **Contr\xF4les automatiques** : assertion de statut + test `statut 2xx` + test d\u2019enveloppe JSON (ignor\xE9 pour 204 et les fichiers).\nrequest:\n  variables:\n    - name: baseUrl\n      value: http://localhost:4000\ndocs:\n  content: |-\n    # MediClinic API \u2014 collection Bruno compl\xE8te\n\n    152 requ\xEAtes couvrant tous les endpoints de l'API (24 modules + sant\xE9).\n\n    ## D\xE9marrage\n    1. D\xE9marrer l'API : `npm run dev:api` (port 4000 par d\xE9faut).\n    2. Initialiser la base : `npm run db:reset -- --yes` (ou `npm run db:reset` et r\xE9pondre \xAB oui \xBB).\n    3. S\xE9lectionner l'environnement **Local** dans Bruno.\n    4. Ex\xE9cuter **Auth / Login** : le script post-response stocke `accessToken` et `refreshToken`\n       dans les variables Bruno. Toutes les requ\xEAte prot\xE9g\xE9es utilisent\n       `Authorization: Bearer {{accessToken}}`.\n    5. Lancer la collection ou un dossier. **Auth / Login doit toujours \xEAtre ex\xE9cut\xE9 en premier**\n       (ou apr\xE8s un refresh) pour obtenir un token valide (TTL 15 min).\n\n    ## Identifiants de d\xE9monstration\n    - email : `superadmin@mediclinic.fr`\n    - mot de passe : `Passw0rd!2026`\n    - autres comptes : `admin@mediclinic.fr`, `amine.haddad@mediclinic.fr`,\n      `paul.mercier@mediclinic.fr`, `emma.gautier@mediclinic.fr`, `lucie.durand@email.fr`\n\n    ## Variables d'environnement `Local`\n    `baseUrl`, `email`, `password`, `accessToken`, `refreshToken`,\n    `userId`, `roleId`, `permissionId`, `specialtyId`, `departmentId`, `doctorId`,\n    `patientId`, `appointmentId`, `consultationId`, `prescriptionId`, `meetingId`,\n    `labTestId`, `labRequestId`, `medicationId`, `movementId`, `invoiceId`, `paymentId`,\n    `shiftId`, `notificationId`, `auditId`, `docType`, `docId`,\n    `fromDate`, `toDate`, `futureDate`.\n\n    Les requ\xEAtes de mutation utilisent des donn\xE9es de d\xE9monstration ; ajustez les IDs\n    selon l'\xE9tat de votre base. Les dates sont relatives \xE0 novembre 2026.\n\n    ## Conventions\n    - Succ\xE8s : `{ \"data\": ... }` ; listes pagin\xE9es : `{ \"data\": [...], \"meta\": {...} }`.\n    - Erreur : `{ \"error\": { \"code\": \"...\", \"message\": \"...\" } }`.\n    - Cr\xE9ation : 201 ; suppression / logout / reset-password : 204 sans corps.\n    - Chaque requ\xEAte poss\xE8de une assertion de statut et un test d'enveloppe JSON.\n    - Les requ\xEAtes PDF/CSV t\xE9l\xE9chargent un fichier : le test d'enveloppe est ignor\xE9.\n\n    ## Remarque\n    Le runner du plugin Bruno s'ex\xE9cute c\xF4t\xE9 serveur : si `localhost:4000` n'y est pas\n    joignable, importez ce dossier dans l'application Bruno locale (`workspace.yml` d\xE9j\xE0\n    mis \xE0 jour) pour l'ex\xE9cuter depuis votre machine.\n  type: text/markdown\nbundled: true\nextensions:\n  bruno:\n    ignore:\n      - node_modules\n      - .git\n    exportedAt: '2026-11-20T08:06:46.208Z'\n    exportedUsing: Bruno/4.3.0\n";
